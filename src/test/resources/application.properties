spring.application.name=SBB-test

# ---------------------------------------------------------------------------
# 테스트 환경 DB 설정
# - 로컬/CI에서 PostgreSQL이 없어도 테스트가 동작하도록 H2(in-memory)를 사용한다.
# - 운영 설정(application.properties)의 PostgreSQL 접속 정보는 테스트에 영향을 주지 않는다.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 파일 업로드 경로(테스트용)
file.upload-dir=./build/test-uploads

# ---------------------------------------------------------------------------
# 테스트 환경에서는 PostgreSQL 전용 DDL/세션 설정(SET lock_timeout 등)을 실행하지 않는다.
# ---------------------------------------------------------------------------
sbb.legaldong.schema-init.enabled=false

# 스케줄러가 테스트 실행 시간을 늘리는 것을 방지한다(필요 시 개별 테스트에서 활성화).
spring.task.scheduling.enabled=false
