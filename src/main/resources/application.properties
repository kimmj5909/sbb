spring.application.name=SBB

# DataBase-postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# File upload configuration
spring.servlet.multipart.enabled=true
#spring.servlet.multipart.file-size-threshold=2KB
# 법정동 마이그레이션 등 대용량 엑셀 업로드를 고려해 기본 제한을 상향한다.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# File uploadconfiguration
file.upload-dir=C:\\Users\\kfca\\sbb\\uploads


# jPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=1
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

#템플릿 설정
spring.thymeleaf.cache=false

# DevTools
# - 일부 환경에서 RestartClassLoader가 신규/변경된 클래스 로딩에 실패하는 케이스가 있어(restart 시 ClassNotFound 등),
#   템플릿은 캐시를 끄고(thymeleaf.cache=false) 코드 변경은 수동 재기동을 기본으로 한다.
spring.devtools.restart.enabled=false

# ---------------------------------------------------------------------------
# ELK(Elasticsearch/Kibana/Filebeat/Logstash) 로컬 연동 설정
# - /etc 하위 설정을 기준으로 기본값을 "localhost"로 고정한다.
#   - Elasticsearch: http://localhost:9200
#   - Kibana:       http://localhost:5601
#
# [중요] 현재 /etc/elasticsearch/elasticsearch.yml 에서 xpack.security.enabled=true 이므로,
#       애플리케이션에서 Elasticsearch 호출 시 BasicAuth(user/pass)가 필요하다.
#       비밀번호를 소스에 고정하지 않기 위해 환경변수로 주입한다.
# ---------------------------------------------------------------------------
#
# Elasticsearch
# - sbb.elasticsearch.urls : 구 설정 키 호환(=hosts로 바인딩됨)
#
#sbb.elasticsearch.urls=http://localhost:9200
# [중요] 환경에 따라 localhost 해석/포워딩이 달라(IPv6 ::1, WSL localhost forwarding 등) 접속이 흔들릴 수 있다.
# - Windows + WSL 포트포워딩 환경에서는 `localhost:9200`은 되지만 `127.0.0.1:9200`은 실패할 수 있다.
# - 반대로 일부 환경에서는 `localhost`가 IPv6(::1)로 해석되어 실패할 수 있다.
# 따라서 기본값은 `localhost`로 두고, 필요 시 `ELASTIC_HOSTS`로 명시적으로 오버라이드한다.
sbb.elasticsearch.hosts=http://localhost:9200
sbb.elasticsearch.username=elastic
sbb.elasticsearch.password=nayFxoMVC_e4xo7k6qed
sbb.elasticsearch.api-key=T0I5cklad0Jib3VoZGl5VThQZWI6dE1YZjUwRmYxYmpqUlJGZV8zRDBpUQ==
#
# 인덱스 접두사: RequestLoggingInterceptor/LogIngestService가 적재하는 로그 인덱스 접두사
# - 검색은 {index-prefix}* 패턴으로 수행된다.
sbb.elasticsearch.index-prefix=${ELASTIC_INDEX_PREFIX:logs-web}
#sbb.elasticsearch.connect-timeout-ms=2000
#sbb.elasticsearch.socket-timeout-ms=5000
#
# Spring Boot 공용 ES 설정 키(미사용 환경 대비 겸용)
spring.elasticsearch.uris=${sbb.elasticsearch.hosts}
spring.elasticsearch.username=${sbb.elasticsearch.username}
spring.elasticsearch.password=${sbb.elasticsearch.password}

# Kibana (로그 관리 UI)
# - /etc/kibana/kibana.yml: server.port=5601, elasticsearch.hosts=["http://localhost:9200"]
sbb.kibana.url=${KIBANA_URL:http://localhost:5601}

# Filebeat / Logstash 참고용(애플리케이션에서 직접 호출하지 않음 - 운영 점검/문서화 목적)
# - /etc/filebeat/filebeat.yml: inputs.paths=/var/log/*.log, output.elasticsearch.hosts=["localhost:9200"]
# - /etc/logstash/conf.d/*.conf: beats input port=5044 -> Elasticsearch localhost:9200
sbb.filebeat.paths=/var/log/*.log
sbb.logstash.beats-port=5044

# 애플리케이션 로그 파일(기본은 프로젝트 내부에 생성)
# - Filebeat로 수집하려면 /var/log 아래로 경로를 오버라이드하고 권한을 확인한다.
logging.file.name=${SBB_LOG_FILE:./logs/sbb-app.log}

# ---------------------------------------------------------------------------
# SBB HTTP 요청 로그(JSONL) 파일 저장 (Filebeat 수집용)
# - RequestLoggingInterceptor가 생성한 HttpLogEvent를 JSON 라인으로 별도 파일에 저장한다.
# - Filebeat input paths에 이 파일을 추가해 Redis/Logstash를 통해 ES에 적재한다.
# - 기본은 비활성화이며, 운영/테스트에서 활성화 후 경로를 고정하는 것을 권장한다.
# ---------------------------------------------------------------------------
sbb.http-log.enabled=${SBB_HTTP_LOG_ENABLED:false}
sbb.http-log.file=${SBB_HTTP_LOG_FILE:./logs/http-log.jsonl}


logging.level.org.elasticsearch.client=DEBUG
logging.level.org.apache.http=INFO
# Watch Dog
management.endpoints.web.exposure.include=health,info,loggers 

# ---------------------------------------------------------------------------
